# =============================================================================
# Tach Configuration - Architectural Boundary Enforcement
# =============================================================================
# Mirrors the layers in docs/architecture/architecture.md and .importlinter.
# Run with: tach check (or tools/tach_check.sh / .bat)
# =============================================================================

exclude = ["**/__pycache__", "build/", "dist/", ".venv/", "*.egg-info/", "src/agent_workbench/__main__.py"]
source_roots = ["src"]
# exact = false: depends_on lists allowed, not required, dependencies.
exact = false
forbid_circular_dependencies = true
ignore_type_checking_imports = true

# Highest to lowest
layers = [
    "apps",
    "interfaces",
    "services",
    "adapters",
    "core",
]

[[modules]]
path = "agent_workbench.apps"
layer = "apps"
depends_on = [
    { path = "agent_workbench.interfaces" },
    { path = "agent_workbench.services" },
    { path = "agent_workbench.adapters" },
    { path = "agent_workbench.core" },
]

[[modules]]
path = "agent_workbench.interfaces"
layer = "interfaces"
depends_on = [
    { path = "agent_workbench.services" },
    { path = "agent_workbench.adapters" },
    { path = "agent_workbench.core" },
]

[[modules]]
path = "agent_workbench.services"
layer = "services"
depends_on = [
    { path = "agent_workbench.adapters" },
    { path = "agent_workbench.core" },
]

[[modules]]
path = "agent_workbench.adapters"
layer = "adapters"
depends_on = [
    { path = "agent_workbench.core" },
]

[[modules]]
path = "agent_workbench.core"
layer = "core"
depends_on = []
