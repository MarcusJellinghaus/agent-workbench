version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "python"
    # increase-if-necessary: only touch a requirement when a new release falls
    # outside it (e.g. ruff~=0.17 → 0.18, pytest<9.3 → 9.3). "auto" treats this
    # unpublished project as an app and raises every minimum on each release.
    versioning-strategy: "increase-if-necessary"
    allow:
      - dependency-type: "all"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "CI"
    cooldown:
      default-days: 7
